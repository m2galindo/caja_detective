; Caja Detective (Arduino Uno)
;
;   pio run                      compila el programa principal
;   pio run -t upload            sube el programa principal
;   pio run -e uno_debug -t upload   igual, pero con mensajes por el monitor serial
;   pio test -e native           pruebas en la PC: lógica y juego completo (sin placa)
;
; Pruebas de hardware (se suben a la placa y se ven con `pio device monitor`):
;   pio run -e test_leds    -t upload
;   pio run -e test_buttons -t upload
;   pio run -e test_buzzer  -t upload
;   pio run -e test_relay   -t upload

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_flags = -Wall -Wextra
test_ignore = *

[env:uno_debug]
extends = env:uno
build_flags = ${env:uno.build_flags} -DDEBUG_SERIAL

[env:test_leds]
extends = env:uno
build_src_filter = -<*> +<../tools/test_leds.cpp>

[env:test_buttons]
extends = env:uno
build_src_filter = -<*> +<../tools/test_buttons.cpp>

[env:test_buzzer]
extends = env:uno
build_src_filter = -<*> +<../tools/test_buzzer.cpp>

[env:test_relay]
extends = env:uno
build_src_filter = -<*> +<../tools/test_relay.cpp>

[env:native]
platform = native
test_framework = unity
; test/mocks simula Arduino.h y EEPROM.h para probar el código principal (Game) en la PC
build_flags = -std=c++11 -Wall -Wextra -Itest/mocks -Isrc
